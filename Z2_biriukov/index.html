<!DOCTYPE html>
<html lang="sk">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Obedové menu reštaurácií a jedální v okolí FEI STU na jednom mieste.">
  <title>Obedové menu v okolí fakulty | Z2</title>
  <link rel="icon" href="img/meal.svg" type="image/svg+xml">
  <link rel="stylesheet" href="vendor/bootstrap-grid.min.css">
  <link rel="stylesheet" href="css/style.css">
  <script src="vendor/dayjs.min.js" defer></script>
  <script src="js/restaurants.js" defer></script>
  <script src="js/app.js" defer></script>
</head>

<body>
  <a class="skip-link" href="#main">Preskočiť na obsah</a>
  <header class="site-header">
    <div class="container navigation">
      <a class="brand" href="index.html"><img src="img/meal.svg" alt="" width="32" height="32">Obed pri fakulte</a>
    </div>
  </header>
  <main id="main" class="container">
    <div class="page-heading">
      <h1>Čo bude na obed?</h1>
      <button class="button" id="refresh" type="button" aria-label="Aktualizovať menu" title="Aktualizovať menu"><span
          class="refresh-icon" aria-hidden="true">↻</span><span class="refresh-label">Aktualizovať menu</span></button>
    </div>
    <div class="menu-controls" role="region" aria-label="Nastavenie zobrazenia menu">
      <div class="controls-top">
        <div class="day-buttons" id="days" role="group" aria-label="Deň v týždni"></div>
        <details class="settings">
          <summary><svg aria-hidden="true" viewBox="0 0 20 20" width="16" height="16">
              <path d="M3 5h14M3 10h14M3 15h14M7 3v4m6 1v4m-6 1v4" fill="none" stroke="currentColor" stroke-width="1.5"
                stroke-linecap="round" />
            </svg>Nastavenia</summary>
          <div class="settings-panel">
            <label for="source">Zdroj menu</label>
            <select id="source">
              <option value="local">Lokálne kópie</option>
              <option value="online">Weby reštaurácií</option>
            </select>
            <button class="text-button" id="clear" type="button">Vymazať uložené dáta</button>
          </div>
        </details>
      </div>
      <div class="filter-row">
        <span class="controls-label" aria-hidden="true">Reštaurácie</span>
        <fieldset id="filters">
          <legend>Zobraziť reštaurácie</legend>
        </fieldset>
      </div>
    </div>
    <h2 id="view-title" class="view-title">Obedové menu</h2>
    <p id="status" class="status" role="status" aria-live="polite"></p>
    <noscript>
      <p class="notice">Na načítanie a zobrazenie menu je potrebné povoliť JavaScript.</p>
    </noscript>
    <div id="menus" class="row g-3" role="region" aria-label="Menu reštaurácií" aria-busy="false"></div>
  </main>
  <footer class="site-footer container">
    <p>Obed pri fakulte</p>
    <nav class="footer-navigation" aria-label="Hlavná navigácia">
      <ul>
        <li><a href="pages/about.html">O projekte</a></li>
      </ul>
    </nav>
  </footer>
</body>

</html>
